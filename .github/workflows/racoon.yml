name: RACOON · publicar PWA pública
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: racoon-pages
  cancel-in-progress: false
jobs:
  calidad:
    name: Verificar PWA y progreso local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - name: Preparar Chromium para QA (solo CI)
        run: |
          npm install --prefix "$RUNNER_TEMP/racoon-qa" --no-save playwright@1.51.1
          node "$RUNNER_TEMP/racoon-qa/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/racoon-qa/node_modules/playwright/index.js" >> "$GITHUB_ENV"
      - name: Verificar biblioteca, PWA y copia IndexedDB en Chromium
        timeout-minutes: 10
        run: |
          node scripts/qa-browser.mjs
          node scripts/qa-indexeddb.mjs
          node scripts/qa-smart.mjs
  publicar:
    name: Publicar sitio estático en Cloudflare Pages
    needs: calidad
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publicar solo el frontend, sin Functions ni D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.RACOON_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Faltan credenciales de Cloudflare"; exit 1; }
          # Este proyecto ya se creó durante la primera publicación.
          # No volver a crearlo: la lista de proyectos del token puede omitirlo.
          PROJECT="${PROJECT:-racoon-radar-klymapo}"
          if [ "$PROJECT" = "racoon" ]; then PROJECT="racoon-radar-klymapo"; fi
          [[ "$PROJECT" =~ ^[a-z0-9-]+$ ]] || { echo "::error::Nombre de proyecto inválido"; exit 1; }
          npm install -g wrangler@4
          STATIC_DIR="$(mktemp -d)"
          cp -R public/. "$STATIC_DIR/"
          # La publicación deliberadamente no incluye functions/ ni schema.sql.
          test ! -e "$STATIC_DIR/functions" && test ! -e "$STATIC_DIR/schema.sql"
          rm -f "$STATIC_DIR/_routes.json"
          cd "$STATIC_DIR"
          wrangler pages deploy . --project-name "$PROJECT" --branch main
          echo "Publicación estática completada (sin archivos del servidor)."
