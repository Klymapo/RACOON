name: RACOON · publicar PWA pública
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: racoon-pages
  cancel-in-progress: false
jobs:
  calidad:
    name: Verificar PWA y progreso local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/racoon.test.mjs
  publicar:
    name: Publicar sitio estático en Cloudflare Pages
    needs: calidad
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publicar solo el frontend, sin Functions ni D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.RACOON_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Faltan credenciales de Cloudflare"; exit 1; }
          PROJECT="${PROJECT:-racoon}"
          [[ "$PROJECT" =~ ^[a-z0-9-]+$ ]] || { echo "::error::Nombre de proyecto inválido"; exit 1; }
          npm install -g wrangler@4
          wrangler pages project list --json > /tmp/racoon-projects.json
          if ! node -e "const p=require('/tmp/racoon-projects.json'); const a=Array.isArray(p)?p:(p.result||[]); process.exit(a.some(x=>x.name===process.argv[1])?0:1)" "$PROJECT"; then
            wrangler pages project create "$PROJECT" --production-branch main
          fi
          STATIC_DIR="$(mktemp -d)"
          cp -R public/. "$STATIC_DIR/"
          rm -f "$STATIC_DIR/_routes.json"
          cd "$STATIC_DIR"
          wrangler pages deploy . --project-name "$PROJECT" --branch main
          echo "Publicación estática completada (sin archivos del servidor)."
